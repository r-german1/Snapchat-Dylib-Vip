name: Build dylib

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV

    - name: Build Package
      run: |
        make FINALPACKAGE=1

    - name: Find and Upload dylib
      uses: actions/upload-artifact@v4
      with:
        name: MyDylibFile
        path: |
          .theos/obj/*.dylib
          .theos/obj/debug/*.dylib
